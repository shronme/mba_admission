services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mba_admissions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Host access for local Alembic / seed scripts (optional; remove if port 5432 is taken).
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mba_admissions"]
      interval: 3s
      timeout: 3s
      retries: 15

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      APP_ROLE: web
      PORT: "8000"
      ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/mba_admissions
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # Next.js dev server (browser → API). Override in production with your deployed web origin(s).
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://[::1]:3000"
      # Keep health lightweight by default; toggle if you want.
      HEALTHCHECK_DB: "false"
      HEALTHCHECK_REDIS: "false"
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      APP_ROLE: worker
      ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/mba_admissions
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_DEFAULT_QUEUE: default
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:

