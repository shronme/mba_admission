# Default Railway config for services that deploy the **Python API** (and Celery worker)
# from this monorepo. Build context = repo root (required: Dockerfile uses COPY backend/...).
#
# For the Next.js app (`apps/web`), create a separate Railway service and set its
# "Config as code" file to `apps/web/railway.toml` (Railpack / Node).

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
