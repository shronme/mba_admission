# Next.js service on Railway — use as this service’s “Config as code” file
# (path from repo root: apps/web/railway.toml).
#
# In Railway: set the service **Root Directory** to `apps/web` so the build runs
# in the folder that contains package.json.

[build]
builder = "RAILPACK"

[deploy]
# Railway injects PORT; bind on all interfaces for the proxy.
startCommand = "npm run start -- -p $PORT -H 0.0.0.0"
